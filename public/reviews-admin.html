<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Review dashboard | TNT Teaching Tools</title><link rel="stylesheet" href="./website.css"><script src="./site-config.js" defer></script><script src="./reviews.js" defer></script></head><body><main class="review-admin" id="review-admin"><p class="hero-kicker">TNT TEACHING TOOLS</p><h1>Review dashboard</h1><p><a href="./">Back to Cold Call Classroom</a></p><p id="admin-setup">The review service has not been connected yet.</p><form id="review-login" hidden><label>Admin email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form><p id="admin-status" role="status" aria-live="polite"></p><section id="moderation-panel" hidden><div class="review-actions"><label>Show<select id="review-filter"><option value="pending">Awaiting approval</option><option value="approved">Published</option><option value="hidden">Hidden</option></select></label><button id="review-refresh" type="button">Refresh</button><button id="review-logout" type="button">Sign out</button></div><div id="pending-reviews" class="review-list"></div></section></main></body></html>
